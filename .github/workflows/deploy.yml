name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via lftp
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "$FTP_USER,$FTP_PASS" $FTP_HOST -e "
            set ssl:verify-certificate no;
            set ftp:list-options -a;
            set net:timeout 10;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set xfer:clobber on;
            mirror -R --verbose \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob core_modules/ \
              --exclude-glob knowledgebase/ \
              --exclude-glob system/ \
              --exclude-glob user_guide/ \
              --exclude-glob vendor/ \
              --exclude-glob .editorconfig \
              --exclude-glob annual_report.js \
              --exclude-glob contributing.md \
              --exclude-glob in.php \
              --exclude-glob license.txt \
              --exclude-glob logs.txt \
              --exclude-glob mytd_report.js \
              --exclude-glob pax_global_header \
              --exclude-glob quarterly_report.js \
              --exclude-glob readme.rst \
              --exclude-glob upper_management_report.js \
              --exclude-glob upper_management_utilities_report.js \
              . /public_html/Thanos;
            bye
          "
        env:
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
